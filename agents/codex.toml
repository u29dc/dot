#:schema https://developers.openai.com/codex/config-schema.json

# dotfiles-managed: codex-template
# dotfiles-source: agents/codex.toml
#
# Merged into ~/.codex/config.toml by scripts/codex.sh. Values here win, except:
# model, model_reasoning_effort and service_tier only seed new machines (they
# are changed in-app); plugins, marketplaces, projects and existing mcp_servers
# entries stay app-owned. The ChatGPT app writes its own node_repl and
# computer-use MCP servers, so app-internal paths do not belong here. Keys the
# template stops managing are listed in RETIRED in scripts/merge_agent_config.py.

model = "gpt-6.1-sol"
# Smaller windows cost less usage per turn; gpt-6.1-sol defaults to 500k and
# compacting at 270k keeps a margin below the 95% effective window (285k).
model_context_window = 300000
model_auto_compact_token_limit = 270000

service_tier = "default"

model_reasoning_effort = "medium"
model_reasoning_summary = "concise"
model_verbosity = "low"
plan_mode_reasoning_effort = "high"

approval_policy = "never"
approvals_reviewer = "auto_review"
sandbox_mode = "danger-full-access"
web_search = "live"

background_terminal_max_timeout = 1800000
file_opener = "cursor"
project_doc_fallback_filenames = ["AGENTS.md", "CLAUDE.md", "README.md", "CONTEXT.md"]
project_doc_max_bytes = 64000
show_raw_agent_reasoning = true
suppress_unstable_features_warning = true

notify = ["__CODEX_NOTIFY_COMMAND__", "turn-ended"]

[shell_environment_policy]
ignore_default_excludes = false
inherit = "all"

[shell_environment_policy.set]
CHO = "__TOOLS_HOME__/cho/cho"
FIN = "__TOOLS_HOME__/fin/fin"
LET = "__TOOLS_HOME__/let/let"
TAO = "__TOOLS_HOME__/tao/tao"

# Only flags that differ from Codex defaults; `codex features list` shows the
# rest (apps, fast_mode, goals, guardian_approval, hooks, multi_agent,
# shell_snapshot and unified_exec are stable and on by default).
[features]
memories = true
prevent_idle_sleep = true

[agents]
max_concurrent_threads_per_session = 8
max_depth = 2

[history]
max_bytes = 100000000
persistence = "save-all"

[notice]
hide_full_access_warning = true

[tui]
status_line = ["five-hour-limit", "context-used", "model-with-reasoning", "current-dir", "git-branch"]
theme = "github"

[plugins."google-calendar@openai-curated"]
enabled = true

[plugins."gmail@openai-curated"]
enabled = true

[plugins."google-drive@openai-curated"]
enabled = false

[plugins."github@openai-curated"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."cloudflare@openai-curated"]
enabled = true

[plugins."codex-security@openai-curated"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[desktop]
default-service-tier = "fast"
followUpQueueMode = "steer"
keepRemoteControlAwakeWhilePluggedIn = true
notifications-turn-mode = "always"
preventSleepWhileRunning = true
reviewDelivery = "inline"

[desktop.open-in-target-preferences]
global = "zed"
