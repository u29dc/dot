# Atuin configuration
# Reference: https://docs.atuin.sh/configuration/config/

# Sync configuration (optional - can enable later)
# sync_address = "https://api.atuin.sh"
# sync_frequency = "10m"
auto_sync = false
update_check = false

# Search configuration
search_mode = "fuzzy"
filter_mode = "global"
filter_mode_shell_up_key_binding = "session"
workspaces = true
style = "compact"
inline_height = 10
show_preview = true
show_help = true
show_tabs = true
exit_mode = "return-original"
enter_accept = true
keymap_mode = "auto"

# History settings. Patterns are unanchored regexes, so each command name is
# bounded: "^ls( |$)" skips ls but keeps lsof.
history_filter = [
    "^(ls|cd|pwd|exit|clear|cls)( |$)",
]
secrets_filter = true

db_path = "~/.local/share/atuin/history.db"
