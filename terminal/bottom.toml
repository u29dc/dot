# Bottom system monitor configuration
# Reference: https://github.com/ClementTsang/bottom/blob/main/sample_configs/default_config.toml
# Theme selection lives under [styles] theme; the default follows dark terminals.

[flags]
default_widget_type = "proc"
default_widget_count = 1
temperature_type = "c"
rate = "1s"

[processes]
default_grouped = true
case_sensitive = false
whole_word = false
regex = true
